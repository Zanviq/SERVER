name: CI

# 시험만 돈다 (GitHub 호스티드 러너). 배포는 하지 않는다 —
# main 에 push 하면 TwoMES Hosting 이 웹훅을 받아 서버(라즈베리파이)에서 빌드·배포한다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 338개, 개발 PC(Windows)에서 11분
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11" # backend/Dockerfile 과 같은 판
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 의존성
        run: pip install -r backend/requirements.txt pytest httpx
      - name: 스모크 시험 (가짜 모델 — 실제 모델·구글을 부르지 않는다)
        run: python -m pytest backend/test_smoke.py -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22" # 시험이 --experimental-strip-types 를 쓴다 (22.6+)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 시험
        run: npm test
      - name: 빌드 (tsc --noEmit + vite build)
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: compose 문법과 플랫폼 규칙
        # 플랫폼처럼 -f 로 본 파일만 읽는다(로컬용 compose.override.yml 은 서버에 붙지 않는다).
        # TwoMES Hosting 규칙: 호스트 포트(ports)·container_name·cloudflared 를 두지 않는다.
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml --profile terminal config --quiet
          docker compose -f docker-compose.yml --profile terminal config --format json > /tmp/compose.json
          bad="$(jq -r '.services | to_entries[]
            | select(.value.ports or .value.container_name or ((.value.image // "") | test("cloudflared")))
            | .key' /tmp/compose.json)"
          if [ -n "$bad" ]; then
            echo "::error::TwoMES Hosting 규칙 위반(ports / container_name / cloudflared): $bad"
            exit 1
          fi
