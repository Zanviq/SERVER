name: Deploy to home server

# main에 push되면 Pi(셀프호스티드 러너)에서 최신 코드로 컨테이너를 재빌드한다.
# 러너는 아웃바운드로 GitHub에 연결되므로 열린 포트/웹훅이 필요 없다(Cloudflare Tunnel 뒤에서 동작).
on:
  push:
    branches: [main]
  workflow_dispatch: {} # Actions 탭에서 수동 실행도 허용

# 동시 배포 방지: 진행 중인 배포가 끝날 때까지 큐잉(빌드가 겹쳐 컨테이너가 반쯤 갱신되는 것 방지).
concurrency:
  group: deploy-home-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted] # Pi에 등록한 셀프호스티드 러너에서 실행
    timeout-minutes: 30
    steps:
      - name: Pull latest & rebuild
        env:
          # Pi에서 이 리포가 clone된 실제 경로(.env가 있는 곳).
          # 리포지토리 변수 DEPLOY_DIR가 있으면 그것을, 없으면 아래 기본 경로를 사용.
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/zanviq/SERVER' }}
          COMPOSE_PROFILES: tunnel
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_DIR:-}" ]; then
            echo "::error::리포지토리 변수 DEPLOY_DIR가 설정되지 않았습니다. (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          echo "▶ 배포 디렉터리: $DEPLOY_DIR"
          cd "$DEPLOY_DIR"
          echo "▶ 최신 main으로 맞추기 (git fetch + reset; .env는 gitignore라 보존됨)"
          git fetch --prune origin
          git reset --hard origin/main
          # 켜져 있는 프로필을 .env 에서 읽어 함께 재빌드한다.
          # 예전에는 tunnel 하나만 넘겨서, 웹터미널을 켜 두고도 terminal 컨테이너가
          # **영영 재빌드되지 않았다** — 그쪽 코드를 고쳐도 파이에는 반영되지 않는다.
          PROFILE_ARGS="--profile $COMPOSE_PROFILES"
          if grep -qiE '^ENABLE_TERMINAL=(true|1|yes)' .env 2>/dev/null; then
            PROFILE_ARGS="$PROFILE_ARGS --profile terminal"
          fi
          # 되돌릴 자리를 먼저 만든다. 이 다음 줄의 재빌드가 옛 이미지를 dangling 으로
          # 만들고, 그 아래 `docker image prune -f` 가 **그것을 즉시 지운다** —
          # 배포는 성공했는데 런타임이 이상하면 되돌릴 이미지가 하나도 없어서
          # 파이에서 처음부터 다시 빌드하는 수밖에 없었다(수십 분).
          echo "▶ 직전 이미지를 :prev 로 남긴다(롤백용)"
          for svc in backend frontend terminal; do
            img="$(docker compose $PROFILE_ARGS images -q "$svc" 2>/dev/null | head -n1)" || true
            if [ -n "${img:-}" ]; then
              docker tag "$img" "twoems-prev:$svc" && echo "   $svc → twoems-prev:$svc"
            fi
          done

          echo "▶ 컨테이너 재빌드 ($PROFILE_ARGS)"
          docker compose $PROFILE_ARGS up -d --build

          # :prev 태그가 붙은 이미지는 dangling 이 아니므로 prune 이 건드리지 않는다.
          echo "▶ 미사용(dangling) 이미지 정리"
          docker image prune -f

          echo "▶ 기동 확인"
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:8000/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::배포 후 백엔드가 응답하지 않습니다. 되돌리려면 파이에서:"
            echo "::error::  docker tag twoems-prev:backend twoems-server-backend:latest"
            echo "::error::  docker tag twoems-prev:frontend twoems-server-frontend:latest"
            echo "::error::  docker compose $PROFILE_ARGS up -d --no-build"
            docker compose $PROFILE_ARGS logs --tail 80 backend || true
            exit 1
          fi
          echo "✅ 배포 완료: $(git rev-parse --short HEAD)"
