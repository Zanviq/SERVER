# nginx 의 기본 mime.types 에는 **.mjs 가 없다.** 그대로 두면 ES 모듈이
# application/octet-stream 으로 나가고, 브라우저는 그런 MIME 의 모듈 실행을
# 거부한다 — 배포 환경에서 pdf.js 워커(pdf.worker.min-*.mjs)를 못 불러
# "Setting up fake worker failed"로 PDF 가 열리지 않았다. 개발 서버(Vite)는
# 제 MIME 을 붙여 주므로 로컬에서는 드러나지 않는다.
# 같은 층위(http)의 types 블록은 합쳐진다 — mime.types 를 지우지 않는다.
types {
    application/javascript mjs;
}

# 라즈베리파이 + 가정용 회선이라 전송량이 곧 체감 속도다.
# LiveEditor 청크만 573KB인데 압축하면 200KB 아래로 줄어든다.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/javascript application/json application/xml
    text/css text/javascript text/plain text/xml
    image/svg+xml;
# 워커(.mjs)는 1.2MB 다 — 압축하면 3분의 1 아래로 준다. 위 types 로 이 MIME 이 붙는다.

# 클라우드플레어 터널이 붙여 주는 원래 프로토콜을 그대로 넘긴다. 직접(LAN)
# 들어온 요청에는 없으므로 그때는 nginx가 받은 scheme(http)을 쓴다.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 요청을 실제로 보낸 사람. 로그인 시도 제한이 이 값으로 센다.
#
# X-Forwarded-For 는 쓸 수 없다 — `proxy_add_x_forwarded_for` 는 **이어붙이기**라
# 바깥에서 아무 값이나 넣어 보낼 수 있고, 그렇다고 통째로 하나로 묶으면 공격자
# 한 명이 전원을 잠근다. 클라우드플레어가 붙이는 CF-Connecting-IP 는 터널을 지날
# 때 클라우드플레어가 **덮어쓰므로** 바깥에서 위조할 수 없다.
# LAN 에서 직접 들어온 요청에는 없으니 그때는 nginx 가 본 주소를 쓴다.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 대용량 업로드 허용
    client_max_body_size 2048m;

    include /etc/nginx/security-headers.conf;

    # 해시가 붙은 빌드 산출물 — 내용이 바뀌면 파일명이 바뀌므로 영구 캐시.
    # try_files 폴백을 두지 않는다: 배포로 사라진 옛 청크를 요청하면 index.html을
    # 200으로 돌려주게 되어, 브라우저가 JS 자리에서 HTML을 받아 모듈 로드 오류가 난다.
    # 404로 명확히 실패시켜야 앱이 새 번들을 받아온다.
    location /assets/ {
        include /etc/nginx/security-headers.conf;  # add_header 가 있는 곳은 상위 것이 상속되지 않는다
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA 라우팅
    location / {
        # index.html은 절대 캐시하지 않는다. 여기에 현재 번들의 해시가 들어 있어,
        # 이 파일이 캐시되면 배포해도 브라우저가 옛 화면을 계속 띄운다.
        # (Cache-Control이 없으면 브라우저가 휴리스틱 캐싱으로 임의 보관한다)
        include /etc/nginx/security-headers.conf;  # 위와 같은 이유로 여기서도 다시 붙인다
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # /api 는 백엔드 컨테이너로 프록시
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # proxy_set_header 는 들어온 값을 **덮어쓴다** — 바깥에서 이 헤더를 지어내
        # 보내도 여기서 지워지므로, 백엔드는 이 값을 믿어도 된다.
        proxy_set_header X-Client-IP $client_ip;
        proxy_request_buffering off;
        # AI 채팅은 SSE로 흘려보낸다. 버퍼링을 켜두면 이벤트가 모였다 한꺼번에 오고,
        # 기본 60초 read timeout에 걸리면 스트림이 끊겨 "요청 처리 중 오류"가 뜬다
        # (일정 78건 일괄 수정이 실제로 그렇게 끊겼다).
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 웹 터미널 웹소켓 → terminal 컨테이너 (프로필 미실행 시에도 nginx가 뜨도록
    # Docker 내부 DNS로 요청 시점에 해석). 쿠키(server_session)는 자동 전달됨.
    location /term/ws {
        resolver 127.0.0.11 valid=10s;
        set $term_upstream http://terminal:7681;
        proxy_pass $term_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
