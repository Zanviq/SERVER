# 라즈베리파이 + 가정용 회선이라 전송량이 곧 체감 속도다.
# LiveEditor 청크만 573KB인데 압축하면 200KB 아래로 줄어든다.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/javascript application/json application/xml
    text/css text/javascript text/plain text/xml
    image/svg+xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 대용량 업로드 허용
    client_max_body_size 2048m;

    # 해시가 붙은 빌드 산출물 — 내용이 바뀌면 파일명이 바뀌므로 영구 캐시.
    # try_files 폴백을 두지 않는다: 배포로 사라진 옛 청크를 요청하면 index.html을
    # 200으로 돌려주게 되어, 브라우저가 JS 자리에서 HTML을 받아 모듈 로드 오류가 난다.
    # 404로 명확히 실패시켜야 앱이 새 번들을 받아온다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA 라우팅
    location / {
        # index.html은 절대 캐시하지 않는다. 여기에 현재 번들의 해시가 들어 있어,
        # 이 파일이 캐시되면 배포해도 브라우저가 옛 화면을 계속 띄운다.
        # (Cache-Control이 없으면 브라우저가 휴리스틱 캐싱으로 임의 보관한다)
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # /api 는 백엔드 컨테이너로 프록시
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        # AI 채팅은 SSE로 흘려보낸다. 버퍼링을 켜두면 이벤트가 모였다 한꺼번에 오고,
        # 기본 60초 read timeout에 걸리면 스트림이 끊겨 "요청 처리 중 오류"가 뜬다
        # (일정 78건 일괄 수정이 실제로 그렇게 끊겼다).
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 웹 터미널 웹소켓 → terminal 컨테이너 (프로필 미실행 시에도 nginx가 뜨도록
    # Docker 내부 DNS로 요청 시점에 해석). 쿠키(server_session)는 자동 전달됨.
    location /term/ws {
        resolver 127.0.0.11 valid=10s;
        set $term_upstream http://terminal:7681;
        proxy_pass $term_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
