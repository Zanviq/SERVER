# 모든 응답에 붙이는 보안 헤더.
#
# nginx의 add_header 는 상속되지 않는다 — 하위 location 에 add_header 가 하나라도
# 있으면 상위 것이 통째로 사라진다. 그래서 파일로 빼서 server 와 각 location 에
# 모두 include 한다(캐시 헤더를 따로 주는 곳이 있어서 반드시 필요하다).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# 다른 사이트가 이 앱을 iframe 으로 감싸 클릭을 가로채지 못하게. 문서 뷰어가
# 같은 출처의 PDF 를 iframe 으로 열기 때문에 DENY 가 아니라 SAMEORIGIN 이다.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
# microphone 은 **이 출처에만** 연다(=self). 회의 녹음이 마이크를 쓴다 —
# microphone=() 로 막아 두면 브라우저가 권한 팝업조차 띄우지 않고
# getUserMedia 가 NotAllowedError 로 바로 거절된다(실측). 나머지는 계속 막는다.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self), payment=(), usb=()" always;
