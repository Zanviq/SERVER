# 앱 화면(HTML)에만 붙이는 보안 정책(CSP) — 34차.
#
# 사용자·AI 가 쓴 마크다운을 날 HTML 까지 받아 살균해 그린다. 살균이 한 번이라도 새면 끼어든
# <script> 가 곧 이 서버의 세션으로 무엇이든 할 수 있다. 스크립트를 **같은 출처의 파일로만**
# 제한해 두면 그때도 돌지 않는다(인라인 테마 스크립트는 public/theme-init.js 로 뺐다).
#
# 허용한 바깥: 글꼴 CSS·파일(jsDelivr 의 Pretendard, Google Fonts 의 JetBrains Mono).
# blob: 은 pdf.js 워커·녹음 미리 듣기·그림 미리 보기가 쓴다. connect-src 'self' 는 같은 호스트의
# 웹소켓(웹 터미널)도 받는다(CSP3).
#
# /api 의 응답(원본 파일 — 브라우저 PDF 뷰어로 열린다)에는 붙이지 않는다. object-src 'none' 이
# 내장 PDF 뷰어를 막을 수 있다. 그쪽은 security-headers.conf 의 frame-ancestors 만 받는다.
#
# 검증: 운영 번들에 이 정책을 씌워 전 화면·수식·코드 칠·그림·PDF(pdf.js)를 돌려 막힘 0,
# 끼운 인라인 스크립트는 막힘(test/csp.test.mjs 가 이 파일의 핵심 규칙을 지킨다).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
